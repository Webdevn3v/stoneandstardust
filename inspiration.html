<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inspiration | Stone & Stardust</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#4a214f;--gold:#b9904d;--muted:#746776;--line:rgba(74,33,79,.15)}
*{box-sizing:border-box}html,body{margin:0;background:#f8f2f7;color:var(--plum);font-family:Manrope,sans-serif}
header{padding:16px 18px 10px}a{color:inherit;text-decoration:none}.back{font-size:.72rem;color:var(--muted)}
h1{font-family:"Cormorant Garamond",serif;font-size:2rem;margin:14px 0 2px}.hint{font-size:.72rem;color:var(--muted);margin:0}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.gallery::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100vw;height:72svh;scroll-snap-align:start;overflow:hidden;background:linear-gradient(145deg,#eee4ec,#fbf8fa)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fffafc,#eadde8)}
.placeholder span{font-family:"Cormorant Garamond",serif;font-size:1.15rem;color:rgba(74,33,79,.42)}
.name{position:absolute;left:0;right:0;bottom:0;padding:38px 18px 18px;background:linear-gradient(transparent,rgba(20,10,20,.62));color:white;font-family:"Cormorant Garamond",serif;font-size:1.45rem}
.dots{text-align:center;padding:12px;font-size:.7rem;letter-spacing:.35em;color:var(--gold)}
</style></head><body>
<header><a class="back" href="door.html">← Back</a><h1>Inspiration</h1><p class="hint">Swipe through for a little inspiration →</p></header>
<main class="gallery" aria-label="Stone & Stardust inspiration gallery">
<section class="slide"><div class="placeholder"><span>Image coming soon</span></div><div class="name">Single Window Accent</div></section>
<section class="slide"><div class="placeholder"><span>Image coming soon</span></div><div class="name">Balanced Pair</div></section>
<section class="slide"><div class="placeholder"><span>Image coming soon</span></div><div class="name">Window Veil</div></section>
<section class="slide"><div class="placeholder"><span>Image coming soon</span></div><div class="name">Draped Window Accent</div></section>
<section class="slide"><div class="placeholder"><span>Image coming soon</span></div><div class="name">Suncatcher</div></section>
</main><div class="dots">● ○ ○ ○ ○</div>
<script>
const g=document.querySelector('.gallery'),d=document.querySelector('.dots');
g.addEventListener('scroll',()=>{const i=Math.round(g.scrollLeft/innerWidth);d.textContent=[0,1,2,3,4].map(n=>n===i?'●':'○').join(' ')},{passive:true});
</script></body></html>
