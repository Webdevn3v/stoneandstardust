<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebf2"><meta name="description" content="Stone & Stardust creates handcrafted decorative details for windows and spaces.">
<title>Stone & Stardust</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#4a214f;--gold:#b9904d;--muted:#746776;--line:rgba(74,33,79,.15)}
*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--plum);font-family:Manrope,sans-serif;background:linear-gradient(180deg,#f8f3f7,#efe5ef)}
.hero{width:100%;min-height:54vh;background:url('stone.star.hero.png') 65% center/cover no-repeat}.shell{width:min(700px,calc(100% - 32px));margin:auto}
.intro{padding:24px 0 14px}.intro h1{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,7vw,3.1rem);line-height:1;margin:0 0 9px}.intro p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.55}
.paths{display:grid;gap:9px;padding:10px 0 28px}.path{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,250,252,.86);color:var(--plum);text-decoration:none}
.path strong{font-family:"Cormorant Garamond",serif;font-size:1.2rem}.path span{display:block;color:var(--muted);font-size:.68rem;margin-top:2px}.arrow{color:var(--gold);font-size:1.05rem;margin-left:14px}
@media(min-width:760px){.hero{min-height:62vh;background-position:center}.intro{padding-top:30px}}
</style></head><body>
<header class="hero" aria-label="Stone & Stardust"></header>
<main class="shell">
<section class="intro"><h1>Find your path.</h1><p>Handcrafted window strands, layered accents, and one-of-a-kind pieces shaped around the light, texture, color, and story already living in your space.</p></section>
<section class="paths">
<a class="path" href="custom-request.html"><div><strong>Start a Custom Piece</strong><span>Tell us what you have in mind.</span></div><b class="arrow">→</b></a>
<a class="path" href="events.html"><div><strong>Upcoming Events</strong><span>See where Stone &amp; Stardust will be.</span></div><b class="arrow">→</b></a>
</section></main>
</body></html>
